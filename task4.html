<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    #todo-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    #todo-form input,
    #todo-form button {
      padding: 10px;
      font-size: 1em;
    }

    #task-list {
      list-style-type: none;
      padding: 0;
    }

    .task {
      background-color: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #3498db;
    }

    .task.completed {
      text-decoration: line-through;
      opacity: 0.6;
      border-left: 5px solid green;
    }

    .task-details {
      flex: 1;
    }

    .task-buttons button {
      margin-left: 5px;
    }

    .edit-input {
      width: 100%;
      margin-bottom: 5px;
      padding: 5px;
    }

    .due-date {
      font-size: 0.9em;
      color: gray;
    }
  </style>
</head>
<body>
  <h1>To-Do List</h1>
  
  <!-- Form to add a task -->
  <form id="todo-form">
    <input type="text" id="task-input" placeholder="Task name" required />
    <input type="datetime-local" id="datetime-input" />
    <button type="submit">Add Task</button>
  </form>

  <!-- List of tasks will appear here -->
  <ul id="task-list"></ul>

  <script>
    const form = document.getElementById('todo-form');
    const taskInput = document.getElementById('task-input');
    const dateTimeInput = document.getElementById('datetime-input');
    const taskList = document.getElementById('task-list');

    // Event listener for form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const taskText = taskInput.value.trim();
      const taskDateTime = dateTimeInput.value;
      
      if (taskText !== '') {
        addTask(taskText, taskDateTime);
        taskInput.value = '';  // Clear the input after adding a task
        dateTimeInput.value = '';  // Clear the date input
      }
    });

    // Function to add a new task to the list
    function addTask(text, dateTime) {
      const li = document.createElement('li');
      li.className = 'task';

      // Div for task details (name + due date)
      const taskDetails = document.createElement('div');
      taskDetails.className = 'task-details';

      const taskTitle = document.createElement('span');
      taskTitle.textContent = text;

      // Create the due date text (if provided)
      const taskDate = document.createElement('div');
      taskDate.className = 'due-date';
      taskDate.textContent = dateTime ? `Due: ${new Date(dateTime).toLocaleString()}` : '';

      taskDetails.appendChild(taskTitle);
      if (dateTime) taskDetails.appendChild(taskDate);

      // Div for buttons (Complete, Edit, Delete)
      const buttons = document.createElement('div');
      buttons.className = 'task-buttons';

      // Complete button
      const completeBtn = document.createElement('button');
      completeBtn.textContent = '✓';
      completeBtn.onclick = () => li.classList.toggle('completed');

      // Edit button
      const editBtn = document.createElement('button');
      editBtn.textContent = '✎';
      editBtn.onclick = () => editTask(li, taskTitle, taskDate);

      // Delete button
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '🗑️';
      deleteBtn.onclick = () => li.remove();

      // Append the buttons to the task
      buttons.appendChild(completeBtn);
      buttons.appendChild(editBtn);
      buttons.appendChild(deleteBtn);

      // Add the details and buttons to the task list item
      li.appendChild(taskDetails);
      li.appendChild(buttons);

      // Append the task item to the task list
      taskList.appendChild(li);
    }

    // Function to edit a task
    function editTask(li, taskTitle, taskDate) {
      const newText = prompt("Edit task:", taskTitle.textContent);
      if (newText !== null) {
        taskTitle.textContent = newText;
      }

      const newDate = prompt("Edit due date/time (YYYY-MM-DDTHH:MM):", taskDate.textContent.replace("Due: ", ""));
      if (newDate) {
        taskDate.textContent = `Due: ${new Date(newDate).toLocaleString()}`;
        if (!li.classList.contains('due-date')) {
          li.appendChild(taskDate);
        }
      }
    }
  </script>
</body>
</html>
