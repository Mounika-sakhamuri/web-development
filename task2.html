<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2em;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    #display {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 1em;
      cursor: pointer;
    }
    #laps {
      margin-top: 20px;
      max-height: 150px;
      overflow-y: auto;
      list-style: none;
      padding: 0;
    }
    #laps li {
      background: #eee;
      margin: 5px 0;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stopwatch</h1>
    <div id="display">00:00:00.000</div>
    <div>
      <button onclick="startStopwatch()">Start</button>
      <button onclick="pauseStopwatch()">Pause</button>
      <button onclick="resetStopwatch()">Reset</button>
      <button onclick="lapTime()">Lap</button>
    </div>
    <ul id="laps"></ul>
  </div>

  <script>
    let startTime, updatedTime, difference = 0;
    let timerInterval, running = false, lapCount = 0;

    function updateDisplay(time) {
      const ms = String(time % 1000).padStart(3, '0');
      const sec = String(Math.floor((time / 1000) % 60)).padStart(2, '0');
      const min = String(Math.floor((time / 60000) % 60)).padStart(2, '0');
      const hr  = String(Math.floor(time / 3600000)).padStart(2, '0');
      document.getElementById('display').textContent = ${hr}:${min}:${sec}.${ms};
    }

    function startStopwatch() {
      if (!running) {
        running = true;
        startTime = Date.now() - difference;
        timerInterval = setInterval(() => {
          updatedTime = Date.now();
          difference = updatedTime - startTime;
          updateDisplay(difference);
        }, 10);
      }
    }

    function pauseStopwatch() {
      if (running) {
        clearInterval(timerInterval);
        running = false;
      }
    }

    function resetStopwatch() {
      clearInterval(timerInterval);
      running = false;
      difference = 0;
      lapCount = 0;
      updateDisplay(0);
      document.getElementById('laps').innerHTML = '';
    }

    function lapTime() {
      if (!running) return;
      lapCount++;
      const lap = document.createElement('li');
      lap.textContent = Lap ${lapCount}: ${document.getElementById('display').textContent};
      document.getElementById('laps').appendChild(lap);
    }
  </script>
</body>
</html>
